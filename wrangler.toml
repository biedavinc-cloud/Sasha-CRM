# Cloudflare Pages configuration (source of truth for the deployment).
name = "sasha-crm"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# Production database (created in the Cloudflare account; the id is an identifier, not a secret).
[[d1_databases]]
binding = "DB"
database_name = "sasha-crm"
database_id = "c1ae2b6e-17ec-419e-a951-58ef1383a0ed"
migrations_dir = "migrations"
